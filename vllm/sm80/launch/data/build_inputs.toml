schema = "build-inputs/3"
# Paths whose change makes artefacts built at another commit stale: the
# wheel-equality set, the native builder's own inputs and the build driver
# modules the wheel build loads (setup.py: tools/build_rust.py).
patterns = [
  "csrc/**",
  "cmake/**",
  "CMakeLists.txt",
  "setup.py",
  "pyproject.toml",
  "rust/**",
  "requirements/build*.txt",
  "requirements/build/**",
  "vllm/vllm_flash_attn/**",
  "tools/build_rust.py",
]

# The environment modules the wheel build loads (setup.py) hold the build
# variables beside many runtime ones. A change to one of these files counts
# unless it touches only runtime variables: each side is reduced by
# removing (1) from every top-level assignment to a name in `tables` whose
# value is a dict literal, the entries keyed by a string constant not in
# `names`, and (2) from the body of every top-level `if TYPE_CHECKING:`, the
# annotated assignments to a plain name not in `names`; the reduced modules
# are compared as ast.dump() (positions and comments ignored). Everything
# else (helpers, lookup and registration code, imports, build entries)
# counts. A missing file reduces from ""; a file that does not parse counts
# as changed.
[env_modules]
paths = ["vllm/envs.py", "vllm/sm80/envs.py"]
tables = ["environment_variables", "FORK_ENV_VARS", "RETIRED_ENV_VARS"]
names = [
  "CMAKE_BUILD_TYPE",
  "MAX_JOBS",
  "NVCC_THREADS",
  "VERBOSE",
  "VLLM_AMPERE_MARLIN_BUILD",
  "VLLM_DOCKER_BUILD_CONTEXT",
  "VLLM_MAIN_CUDA_VERSION",
  "VLLM_SKIP_PRECOMPILED_VERSION_SUFFIX",
  "VLLM_SKIP_VERSION_SUFFIX",
  "VLLM_TARGET_DEVICE",
  "VLLM_USE_PRECOMPILED",
  "VLLM_USE_PRECOMPILED_RUST",
]
